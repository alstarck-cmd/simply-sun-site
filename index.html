<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simply Sun — the sun, as a single beautiful arc</title>
  <meta name="description" content="Simply Sun is a glanceable sun tracker for iPhone and Apple Watch: one arc, the live sky, and every solar moment of your day.">
  <style>
    :root {
      --bg: #0d1018;
      --text: #eef1f6;
      --muted: #aab1c0;
      --accent: #ffd27a;
      --line: rgba(255, 255, 255, 0.10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255, 184, 92, 0.18), transparent 60%),
        linear-gradient(180deg, #131a2b 0%, var(--bg) 60%);
      color: var(--text);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 80px;
    }
    main { max-width: 560px; text-align: center; }
    .sun {
      width: 64px; height: 64px; border-radius: 50%;
      margin: 0 auto 8px;
      background: radial-gradient(circle at 50% 50%, #fff 0%, #ffe9b8 45%, #ffb84c 100%);
      box-shadow: 0 0 28px 6px rgba(255, 184, 76, 0.55), 0 0 70px 10px rgba(255, 184, 76, 0.25);
    }
    svg.arc { display: block; margin: 0 auto 26px; opacity: 0.85; }
    h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; }
    .tagline { color: var(--muted); font-size: 1.05rem; margin: 0 auto 30px; max-width: 420px; }
    .store-badge { display: inline-block; margin-bottom: 36px; }
    .store-badge img { height: 54px; width: auto; display: block; }
    .links { color: var(--muted); font-size: 0.95rem; }
    .links a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; }
    .links a:hover { color: var(--accent); border-color: var(--accent); }
    .dot { margin: 0 10px; color: var(--line); }
  </style>
</head>
<body>
  <main>
    <div class="sun" aria-hidden="true"></div>
    <svg class="arc" width="320" height="74" viewBox="0 0 320 74" aria-hidden="true">
      <line x1="0" y1="52" x2="320" y2="52" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <path d="M 0 64 C 60 64, 90 8, 160 8 C 230 8, 260 64, 320 64"
            fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="232" cy="34" r="6" fill="#ffe9b8"/>
      <circle cx="232" cy="34" r="11" fill="rgba(255,184,76,0.35)"/>
    </svg>
    <h1>Simply Sun</h1>
    <p class="tagline">The sun as a single beautiful arc — rise, solar noon, set, and the live sky, on iPhone and Apple&nbsp;Watch.</p>
    <a class="store-badge" href="https://apps.apple.com/app/simply-sun-sunrise-sunset/id6785290153">
      <img src="app-store-badge.svg" alt="Download on the App Store">
    </a>
    <p class="links">
      <a href="privacy.html">Privacy Policy</a>
      <span class="dot">·</span>
      <a href="mailto:simplysunapp@gmail.com">simplysunapp@gmail.com</a>
    </p>
  </main>
</body>
</html>
