<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simply Sun — the sun, as a single beautiful arc</title>
  <meta name="description" content="Simply Sun is a glanceable sun tracker for iPhone and Apple Watch: one arc, the live sky, and every solar moment of your day.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Simply Sun">
  <meta property="og:title" content="Simply Sun — Sunrise &amp; Sunset">
  <meta property="og:description" content="The sun as a single beautiful arc. Sun tracker &amp; golden hour, on the App Store.">
  <meta property="og:url" content="https://simplysun.app/">
  <meta property="og:image" content="https://simplysun.app/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://simplysun.app/social-card.png">
  <style>
    :root {
      --bg: #0d1018;
      --text: #eef1f6;
      --muted: #d9d4e2;
      --accent: #ffd27a;
      --line: rgba(255, 255, 255, 0.22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #1e2250 0%, #34397a 34%, #87597a 72%, #c26e62 100%);
      background-attachment: fixed;
      color: var(--text);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 80px;
    }
    main { max-width: 560px; text-align: center; }
    svg.arc { display: block; margin: 0 auto 26px; opacity: 0.85; }
    h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; }
    .tagline { color: var(--muted); font-size: 1.05rem; margin: 0 auto 30px; max-width: 420px; }
    .store-badge { display: inline-block; margin-bottom: 36px; }
    .store-badge img { height: 54px; width: auto; display: block; }
    .links { color: var(--muted); font-size: 0.95rem; }
    .links a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; }
    .links a:hover { color: var(--accent); border-color: var(--accent); }
    .dot { margin: 0 10px; color: var(--line); }
  </style>
</head>
<body>
  <main>
    <svg class="arc" width="320" height="84" viewBox="0 0 320 84" aria-hidden="true">
      <line x1="0" y1="56" x2="320" y2="56" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <path d="M 0 70 C 60 70, 90 12, 160 12 C 230 12, 260 70, 320 70"
            fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="252" cy="56" r="22" fill="rgba(255,184,76,0.18)"/>
      <circle cx="252" cy="56" r="13" fill="rgba(255,200,110,0.38)"/>
      <circle cx="252" cy="56" r="7" fill="#ffe9b8"/>
      <circle cx="252" cy="56" r="4.5" fill="#fff6e0"/>
    </svg>
    <h1>Simply Sun</h1>
    <p class="tagline">The sun as a single beautiful arc — rise, solar noon, set, and the live sky, on iPhone and Apple&nbsp;Watch.</p>
    <a class="store-badge" href="https://apps.apple.com/app/simply-sun-sunrise-sunset/id6785290153">
      <img src="app-store-badge.svg" alt="Download on the App Store">
    </a>
    <p class="links">
      <a href="privacy.html">Privacy Policy</a>
      <span class="dot">·</span>
      <a href="mailto:simplysunapp@gmail.com">simplysunapp@gmail.com</a>
    </p>
  </main>
</body>
</html>
